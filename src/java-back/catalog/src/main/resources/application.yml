server:
  port: 8080

spring:
  application:
    name: catalog
  # Datasource URL and credentials come from SPRING_DATASOURCE_* (AppHost) or @ServiceConnection (tests).
  # Flyway owns the schema; Hibernate only validates the entities against it.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Health endpoint at /health (the MapDefaultEndpoints equivalent).
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
